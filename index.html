<!DOCTYPE html>
<html lang="bn">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#0F1117" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="হালখাতা" />
  <meta name="description" content="হালখাতা - আপনার ব্যক্তিগত আর্থিক ব্যবস্থাপনা অ্যাপ" />
  <link rel="manifest" href="./manifest.json" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&family=Tiro+Bangla&display=swap" rel="stylesheet" />
  <title>হালখাতা</title>
  <style>
    :root {
      --bg: #0F1117;
      --card: #1A1D27;
      --card2: #21253A;
      --accent: #F97316;
      --accent2: #FB923C;
      --accentSoft: #F9731620;
      --green: #22C55E;
      --greenSoft: #22C55E20;
      --red: #F43F5E;
      --redSoft: #F43F5E20;
      --amber: #F59E0B;
      --amberSoft: #F59E0B20;
      --blue: #38BDF8;
      --blueSoft: #38BDF820;
      --purple: #A78BFA;
      --purpleSoft: #A78BFA20;
      --text: #F1F0ED;
      --muted: #6B7080;
      --border: #252836;
      --safe-top: env(safe-area-inset-top, 0px);
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; overflow: hidden; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Hind Siliguri', sans-serif;
      font-size: 14px;
      overscroll-behavior: none;
    }
    #app {
      display: flex;
      flex-direction: column;
      height: 100%;
      max-width: 480px;
      margin: 0 auto;
      position: relative;
    }
    /* ── Top Bar ── */
    #topbar {
      background: var(--card);
      border-bottom: 1px solid var(--border);
      padding: calc(var(--safe-top) + 12px) 16px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-shrink: 0;
      z-index: 10;
    }
    .topbar-left { display: flex; flex-direction: column; }
    .app-name { font-family: 'Tiro Bangla', serif; color: var(--accent); font-size: 22px; font-weight: 700; line-height: 1; }
    .screen-title { color: var(--text); font-size: 13px; font-weight: 600; margin-top: 1px; opacity: 0.7; }
    .balance-pill {
      background: var(--accentSoft);
      border: 1px solid var(--accent);
      border-radius: 20px;
      padding: 5px 12px;
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
    }

    /* ── Content ── */
    #content {
      flex: 1;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      padding: 14px 14px 0;
    }
    #content::-webkit-scrollbar { display: none; }

    /* ── Bottom Nav ── */
    #bottomnav {
      background: var(--card);
      border-top: 1px solid var(--border);
      display: flex;
      padding: 6px 0 calc(var(--safe-bottom) + 6px);
      flex-shrink: 0;
    }
    .nav-btn {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px;
      padding: 5px 2px;
      background: none;
      border: none;
      cursor: pointer;
      color: var(--muted);
      font-family: inherit;
      transition: color 0.15s;
    }
    .nav-btn.active { color: var(--accent); }
    .nav-icon {
      width: 36px; height: 36px;
      border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
      transition: background 0.15s;
    }
    .nav-btn.active .nav-icon { background: var(--accentSoft); }
    .nav-label { font-size: 9px; font-weight: 700; letter-spacing: 0.3px; }

    /* ── Cards ── */
    .card {
      background: var(--card);
      border-radius: 16px;
      padding: 16px;
      margin-bottom: 12px;
      border: 1px solid var(--border);
    }
    .card-sm { padding: 12px; border-radius: 12px; }
    .card-title { font-weight: 700; font-size: 14px; color: var(--text); margin-bottom: 10px; }

    /* ── Hero ── */
    .hero {
      background: linear-gradient(135deg, var(--accent) 0%, #EA580C 100%);
      border-radius: 20px;
      padding: 22px 20px;
      margin-bottom: 12px;
      position: relative;
      overflow: hidden;
    }
    .hero::after {
      content: '';
      position: absolute;
      right: -30px; top: -30px;
      width: 140px; height: 140px;
      border-radius: 50%;
      background: #ffffff10;
    }
    .hero::before {
      content: '';
      position: absolute;
      right: 40px; bottom: -40px;
      width: 100px; height: 100px;
      border-radius: 50%;
      background: #ffffff08;
    }
    .hero-label { color: #ffffffbb; font-size: 11px; font-weight: 600; letter-spacing: 1px; text-transform: uppercase; }
    .hero-val { color: #fff; font-size: 36px; font-weight: 900; line-height: 1.1; margin: 4px 0; }
    .hero-sub { color: #ffffffaa; font-size: 11px; }

    /* ── Tiles ── */
    .tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px; }
    .tile {
      background: var(--card);
      border-radius: 14px;
      padding: 14px 12px;
      border: 1px solid var(--border);
    }
    .tile-emoji { font-size: 20px; margin-bottom: 6px; }
    .tile-val { font-weight: 900; font-size: 18px; }
    .tile-label { color: var(--muted); font-size: 11px; margin-top: 3px; font-weight: 600; }

    /* ── Badge ── */
    .badge {
      display: inline-block;
      padding: 2px 9px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.3px;
    }

    /* ── Row ── */
    .row { display: flex; justify-content: space-between; align-items: center; }
    .list-row {
      display: flex; justify-content: space-between; align-items: center;
      padding: 9px 0;
      border-top: 1px solid var(--border);
    }

    /* ── Bar ── */
    .bar-bg { background: var(--border); border-radius: 4px; height: 6px; margin-top: 5px; }
    .bar-fill { height: 6px; border-radius: 4px; transition: width 0.4s ease; }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 10px 18px;
      border-radius: 12px;
      border: none;
      font-family: inherit;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      color: #fff;
      transition: opacity 0.15s, transform 0.1s;
      white-space: nowrap;
    }
    .btn:active { opacity: 0.85; transform: scale(0.97); }
    .btn-sm { padding: 7px 13px; border-radius: 9px; font-size: 12px; }
    .btn-outline { background: transparent !important; border: 1.5px solid; color: inherit; }

    /* ── Chip filter ── */
    .chips { display: flex; gap: 7px; overflow-x: auto; padding-bottom: 6px; margin-bottom: 6px; }
    .chips::-webkit-scrollbar { display: none; }
    .chip {
      padding: 6px 14px;
      border-radius: 20px;
      border: 1.5px solid var(--border);
      background: transparent;
      color: var(--muted);
      font-family: inherit;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      white-space: nowrap;
      transition: all 0.15s;
    }
    .chip.active { color: #fff; border-color: transparent; }

    /* ── Text helpers ── */
    .t-muted { color: var(--muted); font-size: 12px; }
    .t-bold { font-weight: 700; }
    .t-green { color: var(--green); }
    .t-red { color: var(--red); }
    .t-amber { color: var(--amber); }
    .t-blue { color: var(--blue); }
    .t-accent { color: var(--accent); }

    /* ── Empty ── */
    .empty { text-align: center; padding: 50px 20px; }
    .empty-emoji { font-size: 44px; margin-bottom: 10px; }
    .empty-text { color: var(--muted); font-size: 14px; }

    /* ── Bottom Sheet ── */
    .overlay {
      position: fixed; inset: 0;
      background: #000000CC;
      z-index: 100;
      opacity: 0;
      transition: opacity 0.25s;
      pointer-events: none;
    }
    .overlay.show { opacity: 1; pointer-events: all; }
    .sheet {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%) translateY(100%);
      width: 100%; max-width: 480px;
      background: var(--card);
      border-radius: 22px 22px 0 0;
      padding: 16px 18px calc(var(--safe-bottom) + 24px);
      z-index: 101;
      max-height: 88vh;
      overflow-y: auto;
      transition: transform 0.28s cubic-bezier(0.32,0.72,0,1);
    }
    .sheet.show { transform: translateX(-50%) translateY(0); }
    .sheet::-webkit-scrollbar { display: none; }
    .sheet-handle {
      width: 38px; height: 4px;
      background: var(--border);
      border-radius: 2px;
      margin: 0 auto 14px;
    }
    .sheet-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 18px; }
    .sheet-title { font-weight: 800; font-size: 17px; color: var(--text); }
    .close-btn {
      background: var(--card2); border: none; border-radius: 8px;
      padding: 5px 10px; cursor: pointer; color: var(--muted); font-size: 16px;
    }

    /* ── Form ── */
    .form-group { margin-bottom: 13px; }
    .form-label {
      color: var(--muted); font-size: 11px; font-weight: 700;
      letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 5px;
      display: block;
    }
    .form-input {
      width: 100%;
      background: var(--bg);
      border: 1.5px solid var(--border);
      border-radius: 10px;
      padding: 10px 13px;
      color: var(--text);
      font-size: 14px;
      font-family: inherit;
      outline: none;
      transition: border-color 0.15s;
    }
    .form-input:focus { border-color: var(--accent); }
    .form-input::placeholder { color: var(--muted); }
    select.form-input option { background: var(--card); }

    /* ── Calendar ── */
    .cal-grid { display: grid; grid-template-columns: repeat(7,1fr); gap: 3px; }
    .cal-day-hdr { text-align: center; color: var(--muted); font-size: 10px; font-weight: 700; padding: 4px 0; }
    .cal-day {
      aspect-ratio: 1;
      border-radius: 9px;
      display: flex; flex-direction: column;
      align-items: center; justify-content: flex-start;
      padding-top: 5px;
      border: 1px solid transparent;
      cursor: default;
      position: relative;
    }
    .cal-day.today { background: var(--accent); border-color: var(--accent); }
    .cal-day.has-event { background: var(--card2); }
    .cal-day-num { font-size: 12px; font-weight: 600; color: var(--text); }
    .cal-day.today .cal-day-num { color: #fff; font-weight: 900; }
    .cal-dots { display: flex; gap: 2px; margin-top: 2px; }
    .cal-dot { width: 4px; height: 4px; border-radius: 50%; }

    /* ── Loan card ── */
    .loan-card-inner { display: flex; justify-content: space-between; align-items: flex-start; }

    /* ── Project progress ── */
    .proj-stats { display: flex; gap: 8px; margin-top: 12px; }
    .proj-stat { flex: 1; border-radius: 10px; padding: 10px; }

    /* ── Animations ── */
    @keyframes fadeIn { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
    .screen { animation: fadeIn 0.2s ease; }

    /* ── Install banner ── */
    #install-banner {
      background: linear-gradient(90deg, var(--accent), #EA580C);
      color: #fff;
      padding: 10px 14px;
      display: none;
      align-items: center;
      justify-content: space-between;
      font-size: 13px;
      font-weight: 600;
      flex-shrink: 0;
    }
    #install-banner.show { display: flex; }
    #install-banner button {
      background: #fff; color: var(--accent);
      border: none; border-radius: 8px;
      padding: 5px 12px; font-weight: 700;
      font-size: 12px; cursor: pointer; font-family: inherit;
    }
  </style>
</head>
<body>
<div id="app">
  <div id="topbar">
    <div class="topbar-left">
      <span class="app-name">হালখাতা</span>
      <span class="screen-title" id="screen-title">সারসংক্ষেপ</span>
    </div>
    <div class="balance-pill" id="balance-pill">লোড হচ্ছে...</div>
  </div>

  <div id="install-banner">
    <span>📲 হোম স্ক্রিনে ইন্সটল করুন</span>
    <button id="install-btn">ইন্সটল</button>
  </div>

  <div id="content"></div>

  <nav id="bottomnav">
    <button class="nav-btn active" data-tab="dashboard" onclick="switchTab('dashboard')">
      <div class="nav-icon">🏠</div>
      <span class="nav-label">Overview</span>
    </button>
    <button class="nav-btn" data-tab="income" onclick="switchTab('income')">
      <div class="nav-icon">💵</div>
      <span class="nav-label">আয়</span>
    </button>
    <button class="nav-btn" data-tab="expense" onclick="switchTab('expense')">
      <div class="nav-icon">💸</div>
      <span class="nav-label">খরচ</span>
    </button>
    <button class="nav-btn" data-tab="calendar" onclick="switchTab('calendar')">
      <div class="nav-icon">📅</div>
      <span class="nav-label">ক্যালেন্ডার</span>
    </button>
    <button class="nav-btn" data-tab="savings" onclick="switchTab('savings')">
      <div class="nav-icon">🏦</div>
      <span class="nav-label">সঞ্চয়</span>
    </button>
    <button class="nav-btn" data-tab="loan" onclick="switchTab('loan')">
      <div class="nav-icon">🤝</div>
      <span class="nav-label">ঋণ</span>
    </button>
    <button class="nav-btn" data-tab="project" onclick="switchTab('project')">
      <div class="nav-icon">📁</div>
      <span class="nav-label">প্রজেক্ট</span>
    </button>
  </nav>
</div>

<!-- Bottom Sheet -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div class="sheet-header">
    <span class="sheet-title" id="sheet-title">ফর্ম</span>
    <button class="close-btn" onclick="closeSheet()">✕</button>
  </div>
  <div id="sheet-body"></div>
</div>

<script>
// ══════════════════════════════════════════════════════════════
// DATA
// ══════════════════════════════════════════════════════════════
const CATS = ['Loan','Bill','Bazar','DPS','Gari','Education','Other'];
const STATUS = ['Done','Scheduled','TBD'];
const CAT_COLORS = { Loan:'#F43F5E', Bill:'#F59E0B', Bazar:'#22C55E', DPS:'#A78BFA', Gari:'#38BDF8', Education:'#EC4899', Other:'#6B7080' };
const STATUS_COLORS = { Done:'#22C55E', Scheduled:'#F59E0B', TBD:'#6B7080' };
const MONTHS = ['জানুয়ারি','ফেব্রুয়ারি','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্টেম্বর','অক্টোবর','নভেম্বর','ডিসেম্বর'];
const MONTHS_SHORT = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const uid = () => Math.random().toString(36).slice(2,9);
const today = () => new Date().toISOString().split('T')[0];
const fmt = n => '৳' + Number(n||0).toLocaleString('en-IN');

let DATA = {
  incomes: [],
  expenses: [],
  savings: [],
  loans: [],
  projects: []
};

let currentTab = 'dashboard';
let currentProjectId = null;
let calYear = new Date().getFullYear();
let calMonth = new Date().getMonth();

// Filter state
let expFilterCat = 'All';
let expFilterStatus = 'All';

// ── Persist ──────────────────────────────────────────────────
function loadData() {
  try {
    const raw = localStorage.getItem('halkhataa_v2');
    if (raw) DATA = JSON.parse(raw);
  } catch(e) {}
}
function saveData() {
  try { localStorage.setItem('halkhataa_v2', JSON.stringify(DATA)); } catch(e) {}
}

// ══════════════════════════════════════════════════════════════
// NAVIGATION
// ══════════════════════════════════════════════════════════════
const TAB_TITLES = {
  dashboard:'সারসংক্ষেপ', income:'আয়', expense:'খরচ',
  calendar:'ক্যালেন্ডার', savings:'সঞ্চয়', loan:'ঋণ', project:'প্রজেক্ট'
};

function switchTab(tab) {
  currentTab = tab;
  currentProjectId = null;
  document.querySelectorAll('.nav-btn').forEach(b => b.classList.toggle('active', b.dataset.tab === tab));
  document.getElementById('screen-title').textContent = TAB_TITLES[tab];
  updateBalancePill();
  render();
}

function updateBalancePill() {
  const inc = DATA.incomes.reduce((s,i) => s+Number(i.amount),0);
  const done = DATA.expenses.filter(e=>e.status==='Done').reduce((s,i)=>s+Number(i.amount),0);
  document.getElementById('balance-pill').textContent = fmt(inc - done);
}

// ══════════════════════════════════════════════════════════════
// SHEET MODAL
// ══════════════════════════════════════════════════════════════
function openSheet(title, bodyHtml) {
  document.getElementById('sheet-title').textContent = title;
  document.getElementById('sheet-body').innerHTML = bodyHtml;
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}
function closeSheet() {
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

// ══════════════════════════════════════════════════════════════
// RENDER ROUTER
// ══════════════════════════════════════════════════════════════
function render() {
  const c = document.getElementById('content');
  c.scrollTop = 0;
  if (currentTab === 'dashboard') c.innerHTML = renderDashboard();
  else if (currentTab === 'income') c.innerHTML = renderIncome();
  else if (currentTab === 'expense') c.innerHTML = renderExpense();
  else if (currentTab === 'calendar') c.innerHTML = renderCalendar();
  else if (currentTab === 'savings') c.innerHTML = renderSavings();
  else if (currentTab === 'loan') c.innerHTML = renderLoan();
  else if (currentTab === 'project') {
    if (currentProjectId) c.innerHTML = renderProjectDetail();
    else c.innerHTML = renderProjects();
  }
}

// ══════════════════════════════════════════════════════════════
// DASHBOARD
// ══════════════════════════════════════════════════════════════
function renderDashboard() {
  const inc = DATA.incomes.reduce((s,i)=>s+Number(i.amount),0);
  const done = DATA.expenses.filter(e=>e.status==='Done').reduce((s,i)=>s+Number(i.amount),0);
  const due = DATA.expenses.filter(e=>e.status!=='Done').reduce((s,i)=>s+Number(i.amount),0);
  const totalExp = DATA.expenses.reduce((s,i)=>s+Number(i.amount),0);
  const saving = DATA.savings.reduce((s,i)=>s+Number(i.amount),0);
  const balance = inc - done;

  const catRows = CATS.map(c=>({c, t: DATA.expenses.filter(e=>e.category===c).reduce((s,i)=>s+Number(i.amount),0)}))
    .filter(x=>x.t>0).sort((a,b)=>b.t-a.t);

  const recent = [...DATA.expenses].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,5);

  return `<div class="screen">
  <div class="hero">
    <div class="hero-label">মোট ব্যালেন্স</div>
    <div class="hero-val">${fmt(balance)}</div>
    <div class="hero-sub">মোট আয় − পরিশোধিত খরচ</div>
  </div>

  <div class="tiles">
    <div class="tile"><div class="tile-emoji">💚</div><div class="tile-val t-green">${fmt(inc)}</div><div class="tile-label">মোট আয়</div></div>
    <div class="tile"><div class="tile-emoji">🔴</div><div class="tile-val t-red">${fmt(totalExp)}</div><div class="tile-label">মোট খরচ</div></div>
    <div class="tile"><div class="tile-emoji">✅</div><div class="tile-val t-blue">${fmt(done)}</div><div class="tile-label">পরিশোধিত</div></div>
    <div class="tile"><div class="tile-emoji">⏳</div><div class="tile-val t-amber">${fmt(due)}</div><div class="tile-label">বাকি আছে</div></div>
  </div>

  <div class="card">
    <div class="row"><span class="card-title" style="margin:0">💰 মোট সঞ্চয় (DPS)</span><span class="t-green t-bold" style="font-size:18px">${fmt(saving)}</span></div>
    ${DATA.savings.length===0?'<p class="t-muted" style="margin-top:8px">এখনো কোনো সঞ্চয় নেই</p>':
      DATA.savings.slice(-3).map(s=>`<div class="list-row"><span class="t-muted">${s.month} · ${s.source}</span><span class="t-green t-bold">${fmt(s.amount)}</span></div>`).join('')}
  </div>

  ${catRows.length>0?`<div class="card">
    <div class="card-title">📊 ক্যাটাগরি অনুযায়ী খরচ</div>
    ${catRows.map(({c,t})=>`
      <div style="margin-bottom:10px">
        <div class="row"><span style="color:var(--text);font-size:13px">${c}</span><span style="color:${CAT_COLORS[c]};font-weight:700">${fmt(t)}</span></div>

    <div class="form-group"><label class="form-label">স্ট্যাটাস</label>
      <select class="form-input" id="f-status">${STATUS.map(s=>`<option>${s}</option>`).join('')}</select></div>

    <div id="dps-hint" style="display:none;background:var(--greenSoft);border-radius:10px;padding:9px 12px;margin-bottom:10px;color:var(--green);font-size:12px">
      ✅ এই DPS-টি সঞ্চয়ে স্বয়ংক্রিয়ভাবে যোগ হবে!
    </div>
    <button class="btn" style="background:var(--accent);width:100%;margin-top:6px;justify-content:center" onclick="saveExpense()">✔ সেভ করুন</button>`);
  
  // DPS hint toggle
  setTimeout(() => {
    const catSel = document.getElementById('f-cat');
    const statusSel = document.getElementById('f-status');
    const hint = document.getElementById('dps-hint');
    const check = () => { if(catSel&&statusSel&&hint) hint.style.display = (catSel.value==='DPS'&&statusSel.value==='Done')?'block':'none'; };
    if(catSel) catSel.addEventListener('change', check);
    if(statusSel) statusSel.addEventListener('change', check);

}

function saveExpense() {
  const amount = document.getElementById('f-amount').value;
  const cat = document.getElementById('f-cat').value;
  const status = document.getElementById('f-status').value;
  const date = document.getElementById('f-date').value;
  if (!amount) { alert('পরিমাণ দিন'); return; }
  const entry = { id:uid(), date, amount:Number(amount), category:cat, status, notes:document.getElementById('f-notes').value };
  DATA.expenses.unshift(entry);
  // Auto-save DPS
  if (cat==='DPS' && status==='Done') {
    const month = date.slice(0,7);
    DATA.savings.push({ id:uid(), month, amount:Number(amount), source:'DPS', notes:entry.notes });
  }
  saveData(); closeSheet(); render(); updateBalancePill();
}

function toggleExpStatus(id) {
  const map = { Done:'Scheduled', Scheduled:'Done', TBD:'Done' };
  DATA.expenses = DATA.expenses.map(e => {
    if (e.id!==id) return e;
    const next = map[e.status]||'Done';
    // Auto DPS saving
    if (e.category==='DPS' && next==='Done') {
      const month = e.date.slice(0,7);
      if (!DATA.savings.find(s=>s.month===month&&s.source==='DPS'&&s.amount===e.amount)) {
        DATA.savings.push({ id:uid(), month, amount:e.amount, source:'DPS', notes:e.notes });
      }
    }
    return { ...e, status:next };
  });
  saveData(); render(); updateBalancePill();
}

function delExpense(id) {
  if (!confirm('এই খরচ মুছে ফেলবেন?')) return;
  DATA.expenses = DATA.expenses.filter(e=>e.id!==id);
  saveData(); render(); updateBalancePill();
}

// ══════════════════════════════════════════════════════════════
// CALENDAR
// ══════════════════════════════════════════════════════════════
function renderCalendar() {
  const m = String(calMonth+1).padStart(2,'0');
  const prefix = `${calYear}-${m}`;
  const firstDay = new Date(calYear,calMonth,1).getDay();
  const daysInMonth = new Date(calYear,calMonth+1,0).getDate();
  const todayDate = new Date().getDate();
  const isCurrent = calYear===new Date().getFullYear() && calMonth===new Date().getMonth();

  // Build day event map
  const dayMap = {};
  DATA.incomes.filter(i=>i.date.startsWith(prefix)).forEach(i=>{
    const d = +i.date.split('-')[2];
    if(!dayMap[d]) dayMap[d]={inc:0,exp:0};
    dayMap[d].inc += Number(i.amount);
  });
  DATA.expenses.filter(e=>e.date.startsWith(prefix)).forEach(e=>{
    const d = +e.date.split('-')[2];
    if(!dayMap[d]) dayMap[d]={inc:0,exp:0};
    dayMap[d].exp += Number(e.amount);
  });

  // Cells
  let cells = '';
  for(let i=0;i<firstDay;i++) cells += '<div></div>';
  for(let d=1;d<=daysInMonth;d++){
    const ev = dayMap[d];
    const isToday = isCurrent && d===todayDate;
    cells += `<div class="cal-day${isToday?' today':ev?' has-event':''}">
      <span class="cal-day-num">${d}</span>
      <div class="cal-dots">
        ${ev&&ev.inc>0?'<div class="cal-dot" style="background:var(--green)"></div>':''}
        ${ev&&ev.exp>0?'<div class="cal-dot" style="background:var(--red)"></div>':''}
      </div>
    </div>`;
  }

  // Month summary
  const summaryRows = Object.entries(dayMap).sort((a,b)=>+a[0]-+b[0]).map(([d,ev])=>`
    <div class="list-row">
      <span class="t-muted">${prefix}-${String(d).padStart(2,'0')}</span>
      <div style="display:flex;gap:12px">
        ${ev.inc>0?`<span class="t-green t-bold">+${fmt(ev.inc)}</span>`:''}
        ${ev.exp>0?`<span class="t-red t-bold">-${fmt(ev.exp)}</span>`:''}
      </div>
    </div>`).join('');

  return `<div class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
    <button onclick="calNav(-1)" style="background:var(--card2);border:none;border-radius:10px;padding:8px 16px;color:var(--text);font-size:20px;cursor:pointer">‹</button>
    <span style="font-weight:800;font-size:18px">${MONTHS[calMonth]} ${calYear}</span>
    <button onclick="calNav(1)" style="background:var(--card2);border:none;border-radius:10px;padding:8px 16px;color:var(--text);font-size:20px;cursor:pointer">›</button>
  </div>

  <div class="card" style="padding:12px">
    <div class="cal-grid" style="margin-bottom:6px">
      ${['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'].map(d=>`<div class="cal-day-hdr">${d}</div>`).join('')}
    </div>
    <div class="cal-grid">${cells}</div>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:10px">
      <div style="display:flex;align-items:center;gap:5px"><div class="cal-dot" style="background:var(--green)"></div><span class="t-muted">আয়</span></div>
      <div style="display:flex;align-items:center;gap:5px"><div class="cal-dot" style="background:var(--red)"></div><span class="t-muted">খরচ</span></div>
    </div>
  </div>

  ${summaryRows?`<div class="card"><div class="card-title">মাসিক সারসংক্ষেপ</div>${summaryRows}</div>`:''}
  <div style="height:80px"></div></div>`;
}

function calNav(dir) {
  calMonth += dir;
  if(calMonth<0){calMonth=11;calYear--;}
  if(calMonth>11){calMonth=0;calYear++;}
  render();
}

function saveLoan() {
  const person = document.getElementById('f-person').value;
  const amount = document.getElementById('f-amount').value;
  if (!person||!amount) { alert('নাম ও পরিমাণ দিন'); return; }
  DATA.loans.push({ id:uid(), person, type:document.getElementById('f-type').value, amount:Number(amount), dueDate:document.getElementById('f-due').value, notes:document.getElementById('f-notes').value, status:'pending' });
  saveData(); closeSheet(); render();
}

function toggleLoan(id) {
  DATA.loans = DATA.loans.map(l => l.id===id ? {...l, status: l.status==='settled'?'pending':'settled'} : l);
  saveData(); render();
}

function delLoan(id) {
  if (!confirm('মুছে ফেলবেন?')) return;
  DATA.loans = DATA.loans.filter(l=>l.id!==id);
  saveData(); render();
}

// ══════════════════════════════════════════════════════════════
// PROJECTS
// ══════════════════════════════════════════════════════════════
function renderProjects() {
  return `<div class="screen">
  <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
    <span style="font-weight:800;font-size:16px">প্রজেক্টসমূহ</span>
    <button class="btn btn-sm" style="background:var(--accent)" onclick="openProjectForm()">+ নতুন প্রজেক্ট</button>
  </div>
  ${DATA.projects.length===0?'<div class="empty"><div class="empty-emoji">📁</div><div class="empty-text">কোনো প্রজেক্ট নেই</div></div>':
    DATA.projects.map(p=>{
      const out = p.entries.filter(e=>e.flow==='out').reduce((s,e)=>s+Number(e.amount),0);
      const inn = p.entries.filter(e=>e.flow==='in').reduce((s,e)=>s+Number(e.amount),0);
      const pct = p.budget ? Math.min(100,(out/Number(p.budget))*100) : 0;
      const barColor = pct>90?'var(--red)':pct>70?'var(--amber)':'var(--accent)';
      return `<div class="card" onclick="openProject('${p.id}')" style="cursor:pointer">
        <div style="display:flex;justify-content:space-between;margin-bottom:6px">
          <span style="font-weight:700;font-size:15px">${p.name}</span>
          <span class="badge" style="color:${p.status==='active'?'var(--green)':'var(--muted)'};background:${p.status==='active'?'var(--greenSoft)':'#6B708022'}">${p.status==='active'?'সক্রিয়':'বন্ধ'}</span>
        </div>
        ${p.budget?`<div class="t-muted" style="margin-bottom:8px">বাজেট: ${fmt(p.budget)}</div>`:''}
        <div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px">
          <span class="t-green">আয়: ${fmt(inn)}</span>
          <span class="t-red">ব্যয়: ${fmt(out)}</span>
        </div>
        ${p.budget?`<div class="bar-bg"><div class="bar-fill" style="background:${barColor};width:${pct}%"></div></div>`:''}
      </div>`;
    }).join('')}
  <div style="height:80px"></div></div>`;
}

function openProject(id) {
  currentProjectId = id;
  render();
}

function renderProjectDetail() {
  const p = DATA.projects.find(p=>p.id===currentProjectId);
  if (!p) { currentProjectId=null; render(); return ''; }
  const out = p.entries.filter(e=>e.flow==='out').reduce((s,e)=>s+Number(e.amount),0);
  const inn = p.entries.filter(e=>e.flow==='in').reduce((s,e)=>s+Number(e.amount),0);
  const pct = p.budget ? Math.min(100,(out/Number(p.budget))*100) : 0;
  const barColor = pct>90?'var(--red)':pct>70?'var(--amber)':'var(--green)';

  return `<div class="screen">
  <button onclick="backToProjects()" style="background:var(--card2);border:none;border-radius:10px;padding:8px 14px;color:var(--muted);cursor:pointer;margin-bottom:14px;font-family:inherit;font-size:13px;font-weight:600">← পিছনে</button>
  
  <div class="card" style="background:linear-gradient(135deg,#F9731615,var(--card))">
    <div style="font-weight:800;font-size:20px;margin-bottom:4px">${p.name}</div>
    ${p.deadline?`<div class="t-muted">শেষ তারিখ: ${p.deadline}</div>`:''}
    ${p.budget?`
      <div class="row" style="margin:12px 0 4px"><span class="t-muted">বাজেট ব্যবহার</span><span style="font-weight:700">${fmt(out)} / ${fmt(p.budget)}</span></div>
      <div class="bar-bg"><div class="bar-fill" style="background:${barColor};width:${pct}%"></div></div>
    `:''}
    <div class="proj-stats">
      <div class="proj-stat" style="background:var(--greenSoft)"><div style="color:var(--muted);font-size:10px;font-weight:700">প্রাপ্ত</div><div style="color:var(--green);font-weight:800;font-size:18px">${fmt(inn)}</div></div>
      <div class="proj-stat" style="background:var(--redSoft)"><div style="color:var(--muted);font-size:10px;font-weight:700">ব্যয়</div><div style="color:var(--red);font-weight:800;font-size:18px">${fmt(out)}</div></div>
    </div>
  </div>

  <div style="display:flex;justify-content:flex-end;margin-bottom:12px">
    <button class="btn btn-sm" style="background:var(--accent)" onclick="openEntryForm()">+ এন্ট্রি যোগ করুন</button>
  </div>

  ${p.entries.length===0?'<div class="empty"><div class="empty-emoji">📝</div><div class="empty-text">কোনো এন্ট্রি নেই</div></div>':
    [...p.entries].sort((a,b)=>b.date.localeCompare(a.date)).map(ent=>`
      <div class="card">
        <div style="display:flex;justify-content:space-between;align-items:center">
          <div>
            <div style="font-weight:600;font-size:13px">${ent.label}</div>
            <div class="t-muted">${ent.date}</div>
          </div>
          <span style="color:${ent.flow==='in'?'var(--green)':'var(--red)'};font-weight:800;font-size:17px">
            ${ent.flow==='in'?'+':'-'}${fmt(ent.amount)}
          </span>
        </div>
      </div>`).join('')}
  <div style="height:80px"></div></div>`;
}

function backToProjects() {
  currentProjectId = null;
  render();
}

function openProjectForm() {
  openSheet('নতুন প্রজেক্ট', `
    <div class="form-group"><label class="form-label">প্রজেক্টের নাম</label><input class="form-input" type="text" id="f-name" placeholder="যেমন: বাড়ি সংস্কার..."></div>
    <div class="form-group"><label class="form-label">বাজেট (৳) — ঐচ্ছিক</label><input class="form-input" type="number" id="f-budget" placeholder="০" inputmode="numeric"></div>
    <div class="form-group"><label class="form-label">শেষ তারিখ</label><input class="form-input" type="date" id="f-deadline"></div>
    <button class="btn" style="background:var(--accent);width:100%;margin-top:6px;justify-content:center" onclick="saveProject()">✔ তৈরি করুন</button>`);
}

function saveProject() {
  const name = document.getElementById('f-name').value;
  if (!name) { alert('প্রজেক্টের নাম দিন'); return; }
  DATA.projects.push({ id:uid(), name, budget:document.getElementById('f-budget').value, deadline:document.getElementById('f-deadline').value, status:'active', entries:[] });
  saveData(); closeSheet(); render();
}

function openEntryForm() {
  openSheet('এন্ট্রি যোগ করুন', `
    <div class="form-group"><label class="form-label">তারিখ</label><input class="form-input" type="date" id="f-date" value="${today()}"></div>
    <div class="form-group"><label class="form-label">বিষয়</label><input class="form-input" type="text" id="f-label" placeholder="কিসের জন্য?"></div>
    <div class="form-group"><label class="form-label">পরিমাণ (৳)</label><input class="form-input" type="number" id="f-amount" placeholder="০" inputmode="numeric"></div>
    <div class="form-group"><label class="form-label">ধরন</label>
      <select class="form-input" id="f-flow"><option value="out">ব্যয় (বের হয়েছে)</option><option value="in">প্রাপ্তি (এসেছে)</option></select></div>
    <button class="btn" style="background:var(--accent);width:100%;margin-top:6px;justify-content:center" onclick="saveEntry()">✔ সেভ করুন</button>`);
}

function saveEntry() {
  const label = document.getElementById('f-label').value;
  const amount = document.getElementById('f-amount').value;
  if (!label||!amount) { alert('বিষয় ও পরিমাণ দিন'); return; }
  DATA.projects = DATA.projects.map(p => p.id===currentProjectId
    ? { ...p, entries:[...p.entries,{id:uid(),date:document.getElementById('f-date').value,label,amount:Number(amount),flow:document.getElementById('f-flow').value}] }
    : p);
  saveData(); closeSheet(); render();
}

// PWA INSTALL
// ══════════════════════════════════════════════════════════════
let deferredPrompt = null;
window.addEventListener('beforeinstallprompt', e => {
  e.preventDefault();
  deferredPrompt = e;
  document.getElementById('install-banner').classList.add('show');
});
document.getElementById('install-btn').addEventListener('click', async () => {
  if (!deferredPrompt) return;
  deferredPrompt.prompt();
  const { outcome } = await deferredPrompt.userChoice;
  if (outcome === 'accepted') document.getElementById('install-banner').classList.remove('show');
  deferredPrompt = null;
});
